name: build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show SDK info
        run: dotnet --info

      - name: Restore
        run: dotnet restore "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj"

      - name: Build
        run: dotnet build "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -c Release --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCL-Warband
          path: Plain Craft Launcher 2/bin/Release/net48/
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: PCL-Warband
          path: dist

      - name: Package zip
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          Compress-Archive -Path dist\* -DestinationPath "PCL-Warband-$tag-win-x64.zip" -Force

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: PCL-Warband-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
